name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every job only reads the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Glob, not a directory: Node 24 doesn't expand `node --test tests/`.
      - name: Unit tests
        run: node --test tests/*.test.js

      - uses: dtolnay/rust-toolchain@stable

      - name: Search helper
        run: |
          cargo test --locked --manifest-path search/Cargo.toml
          bin/build-search
          node --test tests/search-integration.test.js

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Syntax errors, unquoted variables and other common bash mistakes.
      - name: ShellCheck
        run: shellcheck --severity=warning bin/plasmacast bin/build-search bin/plasmacast-focus tests/smoke.sh tests/native-transport.sh

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Known vulnerabilities (RustSec advisories) in the search helper's
      # dependencies. Fails when one of the crates in Cargo.lock is affected.
      - name: cargo audit
        run: |
          cargo install --locked cargo-audit
          cargo audit --file search/Cargo.lock
